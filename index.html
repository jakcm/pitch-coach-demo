<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>音准教练 · Pitch Coach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎤</text></svg>">
<style>
  :root{
    --bg:#0a0c11; --panel:#13161f; --panel2:#1a1e29; --line:#242a38;
    --txt:#e8ecf4; --dim:#7c8598; --good:#3ddc84; --bad:#ff5c6c;
    --warn:#ffb020; --accent:#4d8dff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#182033 0%,var(--bg) 60%);
    color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",
    "Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;padding:18px 14px 28px;
    min-height:100vh;
  }
  .app{width:100%;max-width:920px;display:flex;flex-direction:column;gap:14px}

  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex-shrink:0}
  h1{font-size:19px;margin:0;letter-spacing:.5px;font-weight:650}
  h1 span{color:var(--accent)}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);
       padding:2px 8px;border-radius:99px}

  /* flex-shrink:0 —— 否则窗口矮的时候 canvas 会被压扁成一条线 */
  .stage{position:relative;background:var(--panel);border:1px solid var(--line);
         border-radius:16px;overflow:hidden;flex:0 0 auto}
  canvas{display:block;width:100%;height:340px}
  @media (max-width:600px){ canvas{height:280px} }

  .banner{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:10px;background:rgba(10,12,17,.72);
    backdrop-filter:blur(2px);text-align:center;padding:20px}
  .banner.hide{display:none}
  .countdown{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--accent);line-height:1}
  .banner p{margin:0;color:var(--dim);font-size:13px}

  /* live readout */
  .live{display:flex;gap:10px;flex-wrap:wrap}
  .chip{flex:1 1 140px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:10px 14px}
  .chip .k{font-size:11px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
  .chip .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .chip .v small{font-size:12px;font-weight:400;color:var(--dim);margin-left:4px}
  #vDev.on{color:var(--good)} #vDev.off{color:var(--bad)}

  .cue{background:linear-gradient(180deg,#1b2233,#151a26);border:1px solid var(--line);
       border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;
       min-height:64px}
  .cue .arrow{font-size:30px;width:38px;text-align:center;transition:transform .12s}
  .cue .txt{font-size:15px}
  .cue .txt b{font-size:19px;color:var(--accent)}
  .cue .sub{font-size:12.5px;color:var(--dim);margin-top:2px}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,button{font:inherit;color:var(--txt);background:var(--panel2);
    border:1px solid var(--line);border-radius:11px;padding:10px 16px;cursor:pointer}
  select{padding-right:12px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    font-weight:600;min-width:120px}
  button.primary.stop{background:var(--bad);border-color:var(--bad)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);
       border-radius:11px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:10px 13px;background:transparent;font-size:13px}
  .seg button.on{background:var(--line);color:#fff}
  .lbl{font-size:12px;color:var(--dim)}

  .result{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;display:none}
  .result.show{display:block}
  .rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .score{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .n{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
     padding:8px 6px;text-align:center}
  .n .nm{font-size:15px;font-weight:650}
  .n .ct{font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
  .n.ok{border-color:rgba(61,220,132,.55);background:rgba(61,220,132,.09)}
  .n.ok .ct{color:var(--good)}
  .n.off{border-color:rgba(255,92,108,.55);background:rgba(255,92,108,.09)}
  .n.off .ct{color:var(--bad)}
  .n.miss{border-color:rgba(255,176,32,.5);background:rgba(255,176,32,.08)}
  .n.miss .ct{color:var(--warn)}
  .tips{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.7}
  .tips b{color:var(--txt)}
  footer{font-size:11.5px;color:#5a6275;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>音准教练 <span>Pitch Coach</span></h1>
    <span class="tag">实时音高 · 逐音纠错</span>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="banner hide" id="banner">
      <div class="countdown" id="cd">🎤</div>
      <p id="bmsg">戴上耳机，点「开始」跟着蓝线唱</p>
    </div>
  </div>

  <div class="live">
    <div class="chip"><div class="k">目标音</div><div class="v" id="vTarget">—</div></div>
    <div class="chip"><div class="k">你唱的音</div><div class="v" id="vSung">—</div></div>
    <div class="chip"><div class="k">偏差</div><div class="v" id="vDev">—</div></div>
  </div>

  <div class="cue">
    <div class="arrow" id="cueArrow">•</div>
    <div>
      <div class="txt" id="cueTxt">准备开始</div>
      <div class="sub" id="cueSub">目标线是标准音高，跟着它走</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="btn">开始</button>
    <select id="selEx"></select>
    <div class="seg" id="transpose">
      <button data-d="-2">−2</button>
      <button data-d="-1">−1</button>
      <button data-d="0" class="on">原调</button>
      <button data-d="1">+1</button>
      <button data-d="2">+2</button>
    </div>
    <button id="btnGuide" title="示范音开关">示范音：开</button>
    <button id="btnFile" title="分析一段录音">分析录音</button>
    <input type="file" id="fileIn" accept="audio/*" style="display:none">
  </div>

  <div class="result" id="result">
    <div class="rhead">
      <div class="score" id="rScore">0%</div>
      <div>
        <div id="rLine1" style="font-size:14px"></div>
        <div id="rLine2" style="font-size:12.5px;color:var(--dim)"></div>
      </div>
    </div>
    <div class="rgrid" id="rGrid"></div>
    <div class="tips" id="rTips"></div>
  </div>

  <footer>
    音高用 MPM 自相关算法逐帧估计（约 60 帧/秒），参考旋律按音高与时值切分比对。<br>
    必须戴耳机：外放会让伴奏串进麦克风，分数失去意义。
  </footer>
</div>

<script>
"use strict";

/* ───────── 数据 ───────── */
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const nameOf = m => NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const EXERCISES = {
  scale:    { name:"C 大调音阶", bpm:80, notes:[[60,1],[62,1],[64,1],[65,1],[67,1],[69,1],[71,1],[72,2]] },
  twinkle:  { name:"小星星",     bpm:90, notes:[[60,1],[60,1],[67,1],[67,1],[69,1],[69,1],[67,2]] },
  birthday: { name:"生日快乐",   bpm:96, notes:[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2]] },
  arc:      { name:"上下行跳进", bpm:84, notes:[[60,1],[67,1],[62,1],[69,1],[64,1],[71,1],[65,1],[72,1]] },
  longtone: { name:"长音稳定",   bpm:60, notes:[[60,2],[64,2],[67,2],[72,2]] },
};

/* ───────── 状态 ───────── */
const TOL = 50;             // 音分容差
const LEAD_IN = 2.4;        // 预备拍
const TAIL = 1.2;

let ctx = null, analyser = null, micNode = null, stream = null;
let buf = null, raf = null;
let running = false, finished = false;
let frames = [];            // {t, midi|null, rms}
let t0 = 0, total = 0;
let noteList = [];          // {midi, start, dur, name}
let transpose = 0;
let guideOn = true;
let sources = [];
let liveVerdicts = {};      // index -> 'ok'|'off'|'miss'

const $ = id => document.getElementById(id);
const cv = $("cv"), g = cv.getContext("2d");

/* ───────── 音高检测 (MPM / NSDF) ───────── */
function detectPitch(samples, sr) {
  // 降采样 2x，降低自相关开销
  const n = samples.length >> 1;
  const x = new Float32Array(n);
  for (let i = 0; i < n; i++) x[i] = 0.5 * (samples[2*i] + samples[2*i+1]);
  const sr2 = sr / 2;

  // 去直流
  let mean = 0;
  for (let i = 0; i < n; i++) mean += x[i];
  mean /= n;
  let energy = 0;
  for (let i = 0; i < n; i++) { x[i] -= mean; energy += x[i]*x[i]; }
  const rms = Math.sqrt(energy / n);
  if (rms < 0.004) return { hz: null, clarity: 0, rms };

  const tauMin = Math.max(2, Math.floor(sr2 / 1000));
  const tauMax = Math.min(Math.floor(n / 2), Math.floor(sr2 / 70));

  // 平方前缀和，用于归一化分母
  const cs = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) cs[i+1] = cs[i] + x[i]*x[i];

  const nsdf = new Float32Array(tauMax + 2);
  let peak = 0;
  for (let tau = tauMin; tau <= tauMax; tau++) {
    let acf = 0;
    const lim = n - tau;
    for (let j = 0; j < lim; j++) acf += x[j] * x[j+tau];
    const m = cs[lim] + (cs[n] - cs[tau]);
    const v = m > 1e-12 ? (2 * acf / m) : 0;
    nsdf[tau] = v;
    if (v > peak) peak = v;
  }
  if (peak < 0.35) return { hz: null, clarity: peak, rms };

  // 取第一个达到 0.9*峰值的局部极大，避免倍频误判
  const thr = 0.9 * peak;
  let chosen = -1;
  for (let tau = tauMin + 1; tau < tauMax; tau++) {
    if (nsdf[tau] > nsdf[tau-1] && nsdf[tau] >= nsdf[tau+1] && nsdf[tau] >= thr) {
      chosen = tau; break;
    }
  }
  if (chosen < 0) {
    for (let tau = tauMin + 1; tau < tauMax; tau++)
      if (nsdf[tau] >= peak) { chosen = tau; break; }
  }
  if (chosen < 0) return { hz: null, clarity: peak, rms };

  // 抛物线插值
  const a = nsdf[chosen-1], b = nsdf[chosen], c = nsdf[chosen+1];
  const den = a - 2*b + c;
  const shift = Math.abs(den) > 1e-12 ? 0.5 * (a - c) / den : 0;
  const tauF = chosen + Math.max(-1, Math.min(1, shift));
  return { hz: sr2 / tauF, clarity: peak, rms };
}

/* ───────── 生成参考旋律 ───────── */
function buildNotes() {
  const ex = EXERCISES[$("selEx").value];
  const beat = 60 / ex.bpm;
  let t = 0;
  return ex.notes.map(([midi, beats]) => {
    const dur = beats * beat;
    const o = { midi: midi + transpose, start: t, dur, name: nameOf(midi + transpose) };
    t += dur;
    return o;
  });
}

function recalc() {
  noteList = buildNotes();
  total = noteList[noteList.length-1].start + noteList[noteList.length-1].dur + TAIL;
  drawStatic();
}

/* ───────── 坐标映射 ───────── */
function yRange() {
  const ms = noteList.map(n => n.midi);
  const lo = Math.min(...ms) - 4, hi = Math.max(...ms) + 4;
  return [lo, hi];
}
function midiToY(m, h) {
  const [lo, hi] = yRange();
  return h - ((m - lo) / (hi - lo)) * h;
}
function yToMidi(y, h) {
  const [lo, hi] = yRange();
  return lo + (1 - y / h) * (hi - lo);
}
function timeToX(t, w) { return (t / total) * w; }

/* ───────── 绘制 ───────── */
function fitCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}

function drawStatic() {
  if (!noteList.length) recalc();
  const { w, h } = fitCanvas();
  const padT = 18, padB = 26;
  const H = h - padT - padB;

  g.clearRect(0, 0, w, h);

  // 半音网格
  const [lo, hi] = yRange();
  g.lineWidth = 1;
  for (let m = Math.floor(lo); m <= Math.ceil(hi); m++) {
    const y = padT + midiToY(m, H);
    const isC = ((m % 12) + 12) % 12 === 0;
    g.strokeStyle = isC ? "#2c3446" : "#1b2029";
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    if (isC) {
      g.fillStyle = "#4a5468";
      g.font = "10px ui-monospace,monospace";
      g.fillText(nameOf(m), 4, y - 3);
    }
  }

  // 目标音块
  noteList.forEach((n, i) => {
    const x1 = timeToX(n.start, w), x2 = timeToX(n.start + n.dur, w);
    const y = padT + midiToY(n.midi, H);
    const bh = 13;
    const v = liveVerdicts[i];
    let fill = "rgba(77,141,255,.20)", stroke = "rgba(77,141,255,.55)", txt = "#8fb4ff";
    if (v === "ok")   { fill = "rgba(61,220,132,.22)"; stroke = "rgba(61,220,132,.75)"; txt = "#3ddc84"; }
    if (v === "off")  { fill = "rgba(255,92,108,.22)"; stroke = "rgba(255,92,108,.75)"; txt = "#ff5c6c"; }
    if (v === "miss") { fill = "rgba(255,176,32,.18)"; stroke = "rgba(255,176,32,.7)";  txt = "#ffb020"; }
    g.fillStyle = fill;
    g.strokeStyle = stroke;
    g.lineWidth = 1.4;
    roundRect(g, x1 + 2, y - bh/2, Math.max(4, x2 - x1 - 4), bh, 6);
    g.fill(); g.stroke();
    if (x2 - x1 > 30) {
      g.fillStyle = txt;
      g.font = "600 11px ui-monospace,monospace";
      g.textAlign = "center";
      g.fillText(n.name, (x1 + x2) / 2, y + 4);
      g.textAlign = "left";
    }
  });

  // 用户曲线：先画一层暗色描边，避免叠在目标块上看不清
  if (frames.length) {
    g.lineJoin = "round";
    g.lineCap = "round";
    const pts = [];
    for (const f of frames) {
      if (f.midi == null) { pts.push(null); continue; }
      pts.push({ x: timeToX(f.t, w), y: padT + midiToY(f.midi, H),
                 t: f.t, m: f.midi });
    }
    const segColor = (a, b) => {
      const ref = midiAt(b.t);
      const dev = ref == null ? 0 : Math.abs(b.m - ref) * 100;
      return dev <= TOL ? "rgba(61,220,132,1)"
           : dev <= TOL * 2 ? "rgba(255,176,32,1)"
           : "rgba(255,92,108,1)";
    };
    // 描边层
    g.strokeStyle = "rgba(6,8,12,.85)";
    g.lineWidth = 6.5;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i-1], b = pts[i];
      if (!a || !b) continue;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    // 彩色层
    g.lineWidth = 3;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i-1], b = pts[i];
      if (!a || !b) continue;
      g.strokeStyle = segColor(a, b);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    // 末端光点
    const lastP = pts.filter(Boolean).pop();
    if (lastP) {
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(lastP.x, lastP.y, 3.4, 0, 7); g.fill();
    }
  }

  // 播放头
  if (running && !finished) {
    const t = ctx.currentTime - t0;
    if (t >= 0 && t <= total) {
      const x = timeToX(t, w);
      g.strokeStyle = "rgba(255,255,255,.75)";
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x, padT - 6); g.lineTo(x, h - padB + 4); g.stroke();
      g.fillStyle = "rgba(255,255,255,.9)";
      g.beginPath(); g.arc(x, padT - 8, 3.5, 0, 7); g.fill();
    }
  }
}

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function midiAt(t) {
  for (const n of noteList)
    if (t >= n.start && t < n.start + n.dur) return n.midi;
  return null;
}

/* ───────── 音频 ───────── */
async function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0;
    buf = new Float32Array(analyser.fftSize);
  }
  if (ctx.state === "suspended") {
    // resume() 在没有用户手势时可能永不 resolve，别让它卡住分析流程
    try {
      await Promise.race([
        ctx.resume(),
        new Promise(r => setTimeout(r, 400)),
      ]);
    } catch (e) { /* 忽略：分析不依赖 AudioContext 的运行状态 */ }
  }
}

async function ensureAudio() {
  await ensureCtx();
  if (!stream) {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    });
    micNode = ctx.createMediaStreamSource(stream);
    micNode.connect(analyser);
  }
}

function scheduleGuide(from) {
  sources = [];
  if (!guideOn) return;
  const master = ctx.createGain();
  master.gain.value = 1;
  master.connect(ctx.destination);

  noteList.forEach(n => {
    const t = from + n.start;
    const osc = ctx.createOscillator();
    const gn = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = mtof(n.midi);
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(0.16, t + 0.025);
    gn.gain.setValueAtTime(0.16, Math.max(t + 0.03, t + n.dur - 0.07));
    gn.gain.linearRampToValueAtTime(0, t + n.dur);
    osc.connect(gn); gn.connect(master);
    osc.start(t); osc.stop(t + n.dur + 0.02);
    sources.push(osc);
  });
  sources.push(master);
}

function stopAll() {
  sources.forEach(s => { try { s.stop ? s.stop() : s.disconnect(); } catch(e){} });
  sources = [];
}

/* ───────── 主循环 ───────── */
function loop() {
  if (!running) return;
  raf = requestAnimationFrame(loop);

  const t = ctx.currentTime - t0;
  analyser.getFloatTimeDomainData(buf);
  const p = detectPitch(buf, ctx.sampleRate);

  if (t >= 0 && t <= total) {
    let midi = null;
    if (p.hz && p.hz > 60 && p.hz < 1500) {
      midi = 69 + 12 * Math.log2(p.hz / 440);
    }
    frames.push({ t, midi, rms: p.rms });

    // 实时判定已唱完的音
    noteList.forEach((n, i) => {
      if (t > n.start + n.dur && liveVerdicts[i] === undefined) {
        liveVerdicts[i] = judgeNote(i).verdict;
      }
    });

    updateLive(t, midi);
  }

  drawStatic();

  if (t > total) finish();
}

function judgeNote(i) {
  const n = noteList[i];
  const fs = frames.filter(f => f.t >= n.start && f.t < n.start + n.dur && f.midi != null);
  if (fs.length < 3) return { verdict: "miss", cents: null, sung: null };
  const arr = fs.map(f => f.midi).sort((a,b) => a-b);
  const med = arr[Math.floor(arr.length/2)];
  const cents = (med - n.midi) * 100;
  const v = Math.abs(cents) <= TOL ? "ok" : "off";
  return { verdict: v, cents, sung: med };
}

function updateLive(t, midi) {
  const idx = noteList.findIndex(n => t >= n.start && t < n.start + n.dur);
  if (idx < 0) {
    $("vTarget").textContent = "—";
    $("vSung").textContent = midi ? nameOf(Math.round(midi)) : "—";
    $("vDev").textContent = "—";
    $("vDev").className = "v";
    $("cueTxt").textContent = "跟住蓝线";
    $("cueSub").textContent = "每个音尽量落在块的正中";
    $("cueArrow").textContent = "•";
    return;
  }
  const n = noteList[idx];
  $("vTarget").textContent = n.name;

  if (!midi) {
    $("vSung").textContent = "—";
    $("vDev").textContent = "没声音";
    $("vDev").className = "v off";
    $("cueTxt").innerHTML = `下一个音 <b>${n.name}</b>`;
    $("cueSub").textContent = "张嘴唱出来，麦克风没收到音高";
    $("cueArrow").textContent = "🎤";
    return;
  }

  const cents = (midi - n.midi) * 100;
  const abs = Math.abs(cents);
  $("vSung").textContent = nameOf(Math.round(midi));
  $("vDev").textContent = (cents > 0 ? "+" : "") + cents.toFixed(0) + " 音分";
  $("vDev").className = "v " + (abs <= TOL ? "on" : "off");

  if (abs <= TOL) {
    $("cueArrow").textContent = "✓";
    $("cueArrow").style.transform = "scale(1.1)";
    $("cueTxt").innerHTML = `准了 · <b>${n.name}</b>`;
    $("cueSub").textContent = "保持住这个位置，别漂";
  } else if (cents < 0) {
    $("cueArrow").textContent = "▲";
    $("cueArrow").style.transform = `translateY(${Math.max(-8, cents/25)}px)`;
    $("cueTxt").innerHTML = `唱低了 · 目标是 <b>${n.name}</b>`;
    $("cueSub").textContent = `差 ${abs.toFixed(0)} 音分，往上抬 ${abs > 150 ? "一大截，几乎是隔壁那个音" : "一点点"}`;
  } else {
    $("cueArrow").textContent = "▼";
    $("cueArrow").style.transform = `translateY(${Math.min(8, -cents/25)}px)`;
    $("cueTxt").innerHTML = `唱高了 · 目标是 <b>${n.name}</b>`;
    $("cueSub").textContent = `差 ${abs.toFixed(0)} 音分，往下放 ${abs > 150 ? "一大截，几乎是隔壁那个音" : "一点点"}`;
  }
}

/* ───────── 开始 / 结束 ───────── */
async function start() {
  try {
    await ensureAudio();
  } catch (e) {
    $("cd").textContent = "⚠️";
    $("bmsg").textContent = "拿不到麦克风权限：" + (e.message || e.name) +
      "。请用 https 或 localhost 打开，并允许麦克风。";
    return;
  }

  finished = false; running = true;
  frames = []; liveVerdicts = {}; sources = [];
  $("result").classList.remove("show");
  $("banner").classList.remove("hide");
  $("btn").textContent = "停止";
  $("btn").classList.add("stop");

  t0 = ctx.currentTime + LEAD_IN;
  scheduleGuide(t0);

  // 倒计时
  const tick = () => {
    const left = t0 - ctx.currentTime;
    if (!running) return;
    if (left > 0.05) {
      $("cd").textContent = Math.ceil(left);
      $("bmsg").textContent = "准备好… 第一句 " + noteList[0].name;
      setTimeout(tick, 90);
    } else {
      $("banner").classList.add("hide");
    }
  };
  $("bmsg").textContent = "准备好…";
  tick();

  loop();
}

function stop() {
  running = false;
  cancelAnimationFrame(raf);
  stopAll();
  $("banner").classList.add("hide");
  $("btn").textContent = "开始";
  $("btn").classList.remove("stop");
  drawStatic();
}

function finish() {
  running = false;
  finished = true;
  cancelAnimationFrame(raf);
  stopAll();
  $("btn").textContent = "重唱";
  $("btn").classList.remove("stop");
  drawStatic();
  showResult();
}

function showResult() {
  const res = noteList.map((n, i) => ({ n, i, ...judgeNote(i) }));
  const judged = res.filter(r => r.verdict !== "miss");
  const ok = res.filter(r => r.verdict === "ok").length;
  const acc = judged.length ? Math.round(100 * ok / judged.length) : 0;

  $("rScore").textContent = acc + "%";
  $("rScore").style.color = acc >= 80 ? "var(--good)" : acc >= 50 ? "var(--warn)" : "var(--bad)";

  const offs = res.filter(r => r.verdict === "off");
  const worst = offs.sort((a,b) => Math.abs(b.cents) - Math.abs(a.cents))[0];
  $("rLine1").textContent = `${noteList.length} 个音 · ${ok} 个准 · ${offs.length} 个跑调 · ${res.length-ok-offs.length} 个漏唱`;
  $("rLine2").textContent = worst
    ? `最大偏差 ${worst.n.name}（${worst.cents > 0 ? "+" : ""}${worst.cents.toFixed(0)} 音分，${worst.cents > 0 ? "高了" : "低了"}）`
    : "全部在 ±50 音分以内";

  const grid = $("rGrid");
  grid.innerHTML = "";
  res.forEach(r => {
    const d = document.createElement("div");
    d.className = "n " + r.verdict;
    const c = r.cents == null ? "未检测到"
      : (r.cents > 0 ? "+" : "") + r.cents.toFixed(0) + "¢";
    d.innerHTML = `<div class="nm">${r.n.name}</div><div class="ct">${c}</div>`;
    grid.appendChild(d);
  });

  // 诊断建议
  const flat = res.filter(r => r.cents != null && r.cents < -TOL);
  const sharp = res.filter(r => r.cents != null && r.cents > TOL);
  let advice = "";
  if (flat.length > sharp.length * 2) {
    advice = "<b>系统性偏低</b>：多数错音都是低于目标。常见原因是气息不足、句子后半段支撑垮掉，或者起音前没在脑子里先定好音高。练法是先用「长音稳定」把每个音单独唱满 2 秒，确认音头就准，而不是中途才爬上去。";
  } else if (sharp.length > flat.length * 2) {
    advice = "<b>系统性偏高</b>：多数错音都是高于目标。常见原因是喉咙用力过猛、脖子紧张、越唱越使劲。试着把音量降三成，用更少的力气唱到同样的音高。";
  } else if (offs.length) {
    advice = "偏差方向不统一，说明是<b>单个音没找准</b>而不是发声习惯问题。把跑调的那几个音单独重复唱 5 遍，唱之前先在心里听一遍正确音高。";
  } else {
    advice = "这一条已经很稳了。可以升调（+1 / +2）再练一遍，音域边缘才是真正练到东西的地方。";
  }
  $("rTips").innerHTML = advice;
  $("result").classList.add("show");
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ───────── 上传录音分析 ───────── */
async function analyzeBuffer(audioBuf, maxSec = 90) {
  const sr = audioBuf.sampleRate;
  const ch = audioBuf.getChannelData(0);
  const limit = Math.min(ch.length, Math.round(maxSec * sr));
  const frameLen = sr <= 22050 ? 1024 : 2048;
  const hop = Math.round(sr * 0.01);
  const out = [];
  for (let s = 0; s + frameLen <= limit; s += hop) {
    const p = detectPitch(ch.subarray(s, s + frameLen), sr);
    let midi = null;
    if (p.hz && p.hz > 60 && p.hz < 1500) midi = 69 + 12 * Math.log2(p.hz / 440);
    out.push({ t: (s + frameLen / 2) / sr, midi, rms: p.rms });
  }
  return out;
}

/* 把时间轴对齐到第一个音：录音开头常有静音或多余的前奏 */
function alignToFirstNote(fs) {
  let run = 0, first = null;
  for (const f of fs) {
    if (f.midi != null) { run++; if (run >= 3 && first == null) first = f.t - 0.02; }
    else run = 0;
  }
  if (first == null || first <= 0) return fs;
  return fs.map(f => ({ ...f, t: f.t - first }));
}

async function handleFile(file) {
  $("cd").textContent = "🎧";
  $("bmsg").textContent = "正在分析 " + file.name + " …";
  $("banner").classList.remove("hide");
  $("btn").disabled = true;

  try {
    await ensureCtx();
    const ab = await file.arrayBuffer();
    const audioBuf = await ctx.decodeAudioData(ab);
    const raw = await analyzeBuffer(audioBuf);
    frames = alignToFirstNote(raw);
    liveVerdicts = {};
    const last = frames.length ? frames[frames.length - 1].t : 0;
    total = Math.max(last, noteList[noteList.length - 1].start + noteList[noteList.length - 1].dur) + TAIL;

    // 逐音判定结果直接落到块上
    noteList.forEach((n, i) => { liveVerdicts[i] = judgeNote(i).verdict; });
    drawStatic();
    $("banner").classList.add("hide");
    showResult();
  } catch (e) {
    $("cd").textContent = "⚠️";
    $("bmsg").textContent = "分析失败：" + (e.message || e.name);
    return;
  } finally {
    $("btn").disabled = false;
  }
}

/* ───────── UI 绑定 ───────── */
const selEx = $("selEx");
Object.entries(EXERCISES).forEach(([k, v]) => {
  const o = document.createElement("option");
  o.value = k; o.textContent = v.name;
  selEx.appendChild(o);
});
selEx.value = "scale";

selEx.addEventListener("change", () => {
  if (running) stop();
  liveVerdicts = {}; frames = [];
  $("result").classList.remove("show");
  recalc();
});

$("transpose").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (running) stop();
  [...$("transpose").children].forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  transpose = parseInt(b.dataset.d, 10);
  liveVerdicts = {}; frames = [];
  $("result").classList.remove("show");
  recalc();
});

$("btnGuide").addEventListener("click", () => {
  guideOn = !guideOn;
  $("btnGuide").textContent = "示范音：" + (guideOn ? "开" : "关");
});

$("btn").addEventListener("click", () => {
  if (running) { stop(); return; }
  start();
});

$("btnFile").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (f) handleFile(f);
  e.target.value = "";
});

window.addEventListener("resize", () => { drawStatic(); });

/* 初始化 */
recalc();
drawStatic();
</script>
